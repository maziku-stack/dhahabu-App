name: dhahabu
description: Gold trade platform - Miners, Dealers, Government
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^2.0.0
  http: ^1.2.2
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.4
  provider: ^6.1.2
  intl: ^0.20.3
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.3

flutter_native_splash:
  color: "#0B1F3A"
  image: assets/branding/dhahabu_logo.png
  android_12:
    color: "#0B1F3A"
    image: assets/branding/dhahabu_logo.png

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/
    - assets/images/
    - assets/icon/
